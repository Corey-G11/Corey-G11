<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polyglot — describe it, and it builds it</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>"
    />
    <!-- Apply the saved/system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t =
            localStorage.getItem("polyglot.theme") ||
            (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">🛠️</span>
        <div>
          <h1>Polyglot</h1>
          <p class="tagline">Knows every language. Tell it what you want — it builds it. Runs locally, free.</p>
        </div>
      </div>
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle light or dark theme" title="Toggle theme">🌙</button>
    </header>

    <main>
      <div id="banner" class="banner" hidden></div>

      <form id="build-form" class="composer">
        <div class="row settings">
          <label class="field">
            <span>Language</span>
            <select id="language" name="language"></select>
          </label>
          <label class="field">
            <span>Model</span>
            <select id="model" name="model" title="Models you've pulled with Ollama">
              <option value="">default</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>What should I build?</span>
          <textarea
            id="prompt"
            name="prompt"
            rows="3"
            placeholder="e.g. A CLI to-do app that saves tasks to a JSON file, with add / list / done commands"
            autofocus
          ></textarea>
        </label>
        <div class="actions">
          <button type="submit" id="build-btn" class="primary">Build it</button>
          <button type="button" id="stop-btn" class="ghost" hidden>Stop</button>
          <span id="status" class="status"></span>
        </div>
        <div class="examples" id="examples" aria-label="Example requests"></div>
      </form>

      <section id="history" class="history" hidden>
        <div class="history-head">
          <h2>Recent builds</h2>
          <button type="button" id="history-clear" class="ghost small">Clear</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </section>

      <section id="output" class="output" hidden>
        <div id="output-bar" class="output-bar" hidden>
          <button type="button" id="regen-btn" class="ghost small" title="Run the last request again">↻ Regenerate</button>
          <button type="button" id="zip-btn" class="ghost small">⬇ Download all files (.zip)</button>
        </div>
        <div id="stream" class="stream"></div>
      </section>

      <section id="empty" class="empty">
        <p>Describe a program in plain English. Pick a language or leave it on <strong>Auto</strong> and let Polyglot choose.</p>
      </section>
    </main>

    <footer class="foot">
      <span id="foot-note">Runs locally with Ollama — free, no API key.</span>
    </footer>

    <script src="/lib.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
